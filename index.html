<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kosher Finder</title>
<style>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --ink:#17201c; --muted:#5e6862; --line:#e6e1d6; --soft:#f4f1ea;
  --green:#1e5a3e; --gold:#a97e1e;
  --eidah:#1e5a3e; --rubin:#1f4e8c; --agudah:#5b3a8a; --landau:#8a3a2a; --efrati:#0f6e6e; --ou:#8a5a12; --machpud:#7a3f6a; --ok:#2e6b2e; --stark:#9a2f55; --tzfas:#5a6a1a; --sheiris:#555b58;
  --kofk:#7a5418; --crc:#3d5a80; --chk:#8a2e3e; --kaj:#2f5d50; --vaad:#4d4d8a; --chas:#6a4c93; --nj:#356859; --crclist:#5f6b66;
  --meat:#b23a3a; --dairy:#2b6cb0; --pareve:#5f8a3a;
  --warn:#b7791f; --warnbg:#fdf3dc;
  --radius:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131715; --ink:#eae6dc; --muted:#a8b0aa; --line:#2b332e; --soft:#1b211d;
    --green:#7fc79f; --gold:#d9b25a;
    --eidah:#7fc79f; --rubin:#8fb3ea; --agudah:#b79ce0; --landau:#e0937f; --efrati:#6fc7c7; --ou:#e2b25a; --machpud:#d59cc6; --ok:#9fd49f; --stark:#e79ab6; --tzfas:#c6d67e; --sheiris:#b8bfbb;
    --kofk:#d9a868; --crc:#9fbbe0; --chk:#e39aa8; --kaj:#8fcfb9; --vaad:#a9a9e6; --chas:#c3a6e8; --nj:#8fc9b4; --crclist:#b3bcb7;
    --meat:#e28a8a; --dairy:#8fb3ea; --pareve:#a5cf7a;
    --warn:#e2b14b; --warnbg:#2a2415;
  }
}
:root[data-theme="dark"]{
  --bg:#131715; --ink:#eae6dc; --muted:#a8b0aa; --line:#2b332e; --soft:#1b211d;
  --green:#7fc79f; --gold:#d9b25a;
  --eidah:#7fc79f; --rubin:#8fb3ea; --agudah:#b79ce0; --landau:#e0937f; --efrati:#6fc7c7; --ou:#e2b25a; --machpud:#d59cc6; --ok:#9fd49f; --stark:#e79ab6; --tzfas:#c6d67e; --sheiris:#b8bfbb;
    --kofk:#d9a868; --crc:#9fbbe0; --chk:#e39aa8; --kaj:#8fcfb9; --vaad:#a9a9e6; --chas:#c3a6e8; --nj:#8fc9b4; --crclist:#b3bcb7;
  --meat:#e28a8a; --dairy:#8fb3ea; --pareve:#a5cf7a;
  --warn:#e2b14b; --warnbg:#2a2415;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,.name{font-family:Georgia,"Times New Roman",serif}
a{color:var(--green)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}

/* Sticky control bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px 8px}
.bar h1{margin:0 0 6px;font-size:22px;font-weight:700;line-height:1.15}
.bar h1 small{display:block;font-family:system-ui,sans-serif;font-weight:400;font-size:13px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;background:var(--soft)}
.search input{flex:1;border:0;background:transparent;font:inherit;color:inherit;min-width:0}
.search input:focus{outline:none}
.search svg{flex:none;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.search .clear{color:var(--muted);padding:2px 4px;display:none}
.search.has .clear{display:block}

[hidden]{display:none!important}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .12s,color .12s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c,var(--muted))}
.chip[aria-pressed="true"] .dot{outline:2px solid var(--bg)}

.tabs{display:flex;gap:18px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.tab{padding:4px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}

.status{font-size:14px;color:var(--muted);margin:14px 0 6px}
.notice.closed{border-left-color:var(--meat)}
.notice.info{border-left-color:var(--green);background:var(--soft)}
.notice b{display:block}
.notice b{display:block;margin-bottom:2px}
.notice.calm{border-left-color:var(--green);background:var(--soft)}
.notice{background:var(--warnbg);border-left:3px solid var(--warn);padding:10px 12px;border-radius:0 var(--radius) var(--radius) 0;font-size:14px;margin:14px 0}

/* Results */
.group{margin-top:22px}
.group h2{font-size:15px;font-weight:700;margin:0 0 2px;color:var(--gc);letter-spacing:.01em}
.group h2 span{font-family:system-ui,sans-serif;font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.row{border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.head{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:12px 0}
.kind{width:10px;height:10px;border-radius:50%;background:var(--k);align-self:center}
.name{font-size:18px;font-weight:500;line-height:1.2}
.name .heb{font-size:14px;color:var(--muted);margin-left:6px;font-weight:500}
.sub{font-size:14px;color:var(--muted);grid-column:2;margin-top:2px}
.price{font-size:14px;color:var(--muted);white-space:nowrap;letter-spacing:1px}
.warnmark{color:var(--warn);font-weight:700;margin-left:4px}
.detail{display:none;padding:2px 0 16px 20px;font-size:15px}
.row.open .detail{display:block}
.detail dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:6px 10px}
.detail dt{color:var(--muted);font-size:14px}
.detail dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--radius);padding:7px 12px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--soft)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1a14}}
:root[data-theme="dark"] .btn.primary{color:#0f1a14}
.stamp{display:inline-block;font-size:13px;font-weight:700;color:var(--hc);border:1.5px solid var(--hc);border-radius:3px;padding:0 6px;line-height:1.5;margin-right:6px}
.warnbox{background:var(--warnbg);border-left:3px solid var(--warn);padding:8px 10px;margin:10px 0 0;font-size:14px;border-radius:0 var(--radius) var(--radius) 0}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* Excluded / unconfirmed tables */
.plain{margin-top:16px}
.plain .row{padding:10px 0;display:grid;grid-template-columns:1fr;gap:2px}
.plain .n{font-weight:700}
.plain .r{font-size:14px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:10px}
.locmsg{font-size:13px;color:var(--muted);padding:2px 0 4px;min-height:16px}
select.chip{appearance:none;-webkit-appearance:none;background:var(--bg);padding-right:22px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 6%27%3E%3Cpath d=%27M0 0l5 6 5-6z%27 fill=%27%23888%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;background-size:8px}
.walk{font-weight:700;color:var(--green);white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--k)}
.bar h1 .citysel{font:inherit;font-family:Georgia,"Times New Roman",serif;font-size:22px;font-weight:700;color:inherit;background:transparent;border:0;border-bottom:2px dotted var(--gold);border-radius:0;padding:0 18px 0 0;margin:0;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 6%27%3E%3Cpath d=%27M0 0l5 6 5-6z%27 fill=%27%23a97e1e%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 2px center;background-size:10px}
.bar h1 .citysel option{font-size:16px;color:#17201c;background:#fff}
.stamp small{font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1><select class="citysel" id="city" aria-label="City"></select> kosher finder <small id="citySub"></small></h1>
    <div class="search" id="searchWrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, food, street, neighborhood…" autocomplete="off" aria-label="Search restaurants">
      <button class="clear" id="clearQ" aria-label="Clear search">✕</button>
    </div>
    <div class="chips" id="hechChips" role="group" aria-label="Filter by hechsher"></div>
    <div class="chips" id="kindChips" role="group" aria-label="Filter by meat or dairy"></div>
    <div class="chips" id="locBar">
      <button class="chip" id="locBtn">📍 Use my location</button>
      <select class="chip" id="landmark" aria-label="Or pick where you are"><option value="">…or I'm near</option></select>
      <button class="chip" id="coordBtn">Paste Plus Code / Maps link</button>
      <button class="chip" id="clearLoc" hidden>✕ Clear</button>
    </div>
    <div class="locmsg" id="locMsg"></div>
    <div class="chips" id="walkChips" role="group" aria-label="Max walking time" hidden></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="verified">Verified</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="unconfirmed">Single-source</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="excluded">Excluded</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="items">Certified items only</button>
    </div>
  </div>

  <section id="verified">
    <div class="notice" id="banner"></div>
    <div class="chips" id="pesachChips" role="group" aria-label="Pesach filters" hidden></div>
    <div class="status" id="status"></div>
    <div id="results"></div>
    <div class="legend"><span><i style="--k:var(--meat)"></i>Meat</span><span><i style="--k:var(--dairy)"></i>Dairy</span><span><i style="--k:var(--pareve)"></i>Pareve</span><span>⚠ = conflicting reports, check <span id="legendCert">teudah</span></span></div>
  </section>

  <section id="unconfirmed" hidden>
    <div class="status" id="unconfNote"></div>
    <div class="plain" id="unconfList"></div>
  </section>

  <section id="excluded" hidden>
    <div class="status" id="exclNote"></div>
    <div class="plain" id="exclList"></div>
  </section>

  <section id="items" hidden>
    <div class="status" id="itemsNote"></div>
    <div class="plain" id="itemsList"></div>
  </section>
</div>

<script>

 ["Moishe's Bake Shop","Traditional kosher bakery at 504 Grand St; the Grand St shop stayed open after the 2nd Ave shop closed, and a review says it is closed Saturdays. Sources conflict on the hechsher. CKJ (2026-10) says \"CRC\" without saying which CRC, while TotallyJewishTravel says Mehadrin Kashrus - Rabbi Marmorstein, which is not on the cRc list. Questionable until the certificate is checked."],
 ["Village Crown (216 E 49th St, 2nd Fl)","CKJ (updated 2026-10-13) lists Village Crown at 216 E 49th St, 2nd Fl as OU, and a 2020 list says catering and delivery only (212-207-3888). The OU Manhattan directory has no \"Village Crown\". It does list Esprit Events (OU, dairy) at 216 E 49th St with the same phone, so the OU entry is under the caterer name. Questionable because it is catering/delivery only and the brand is not named in the OU directory."],

 ["Talia's Steakhouse & Bar","Long-running UWS glatt kosher steakhouse at 668B Amsterdam Ave; YTK (2026-03) covers its Seders and Chol Hamoed meals. Supervision is Mehadrin Kashrus / Rabbi Avrohom Marmorstein (CKJ 2026-10; KosherNearMe), which is not on the cRc list, so Questionable."],

 ["Westside Wok","Westside Wok (668B Amsterdam Ave): CKJ Kosher in NYC (2026-10-13) lists it as OK, but it is not in OK's own Manhattan restaurant guide. A press release dated 2026-07-31 says West Side Wok & Konata Sushi Bar moved all their operations into the Talia's Steakhouse kitchen. CKJ lists Talia's under R. Marmorstein, who is not on the cRc list. Which agency certifies the shared kitchen is unclear, so this goes to Questionable."],

// ---- Hebrew calendar (Dershowitz–Reingold); Israel or diaspora observance per the city's ruleset
const HEB_EPOCH=-1373427;
const hLeap=y=>((7*y+1)%19)<7;
const hLastMonth=y=>hLeap(y)?13:12;
function hElapsed(y){const me=Math.floor((235*y-234)/19),pe=12084+13753*me;let d=me*29+Math.floor(pe/25920);if((3*(d+1))%7<3)d+=1;return d}
function hCorr(y){const a=hElapsed(y-1),b=hElapsed(y),c=hElapsed(y+1);if(c-b===356)return 2;if(b-a===382)return 1;return 0}
const hNewYear=y=>HEB_EPOCH+hElapsed(y)+hCorr(y);
const hYearDays=y=>hNewYear(y+1)-hNewYear(y);
function hMonthDays(y,m){if([2,4,6,10,13].includes(m))return 29;if(m===12&&!hLeap(y))return 29;if(m===8&&![355,385].includes(hYearDays(y)))return 29;if(m===9&&[353,383].includes(hYearDays(y)))return 29;return 30}
function hFixed(y,m,d){let t=hNewYear(y)+d-1;if(m<7){for(let k=7;k<=hLastMonth(y);k++)t+=hMonthDays(y,k);for(let k=1;k<m;k++)t+=hMonthDays(y,k)}else{for(let k=7;k<m;k++)t+=hMonthDays(y,k)}return t}
function gFixed(y,m,d){const p=y-1;const md=[31,28,31,30,31,30,31,31,30,31,30,31];const leap=(y%4===0&&y%100!==0)||y%400===0;let doy=d;for(let i=0;i<m-1;i++)doy+=md[i];if(leap&&m>2)doy+=1;return 365*p+Math.floor(p/4)-Math.floor(p/100)+Math.floor(p/400)+doy}
function hFromFixed(f){let y=Math.floor((f-HEB_EPOCH)/(35975351/98496))+1-1;while(hNewYear(y+1)<=f)y++;const start=f<hFixed(y,1,1)?7:1;let m=start;while(f>hFixed(y,m,hMonthDays(y,m)))m++;return{y,m,d:f-hFixed(y,m,1)+1}}
const HMN=["","Nisan","Iyar","Sivan","Tammuz","Av","Elul","Tishrei","Cheshvan","Kislev","Tevet","Shevat","Adar","Adar II"];

  if(m===purimMonth(y)){
    if((d===13&&w!==6)||(d===11&&w===4))return fast("Ta'anit Esther");
    if(C.shushan){
      if(d===14)return{label:"Purim (outside Jerusalem)",msg:"Purim elsewhere in Israel — but Jerusalem keeps Shushan Purim tomorrow. Expect Purim hours and crowds tomorrow.",level:"info"};
      if(d===15)return{label:"Shushan Purim (Jerusalem)",msg:"Shushan Purim in Jerusalem — many restaurants close for the seudah or run special hours; the city center is packed. Call first.",level:"warn"};
    }else{
      if(d===14)return{label:"Purim",msg:"Purim — many restaurants close early for the seudah or run special hours. Call first.",level:"warn"};
      if(d===15)return{label:"Shushan Purim",msg:"Shushan Purim — normal hours here.",level:"info"};
    }
  }
  if(m===1){
    if(d===14)return{label:"Erev Pesach",msg:"Erev Pesach — chametz places are closed; only Pesach-certified kitchens serve, and they close early afternoon.",level:"closed"};
    if(d===15)return closed(D?"Pesach (Yom Tov, day 1)":"Pesach (Yom Tov)");
    if(D&&d===16)return closed("Pesach (Yom Tov, day 2)");
    if(d>=cm1&&d<=20)return{label:"Chol Hamoed Pesach",msg:`Chol Hamoed Pesach (day ${d-cm1+1}) — many places on this list are closed; those open serve Pesach menus under a Pesach ${RU.cert}. Check for kitniyot and gebrokts notes and call first.`,level:"warn"};
    if(d===21)return closed("Shvi'i shel Pesach");
    if(D&&d===22)return closed("Acharon shel Pesach");
    if(d===(D?23:22))return{label:"Isru Chag",msg:"Isru Chag Pesach — most restaurants reopen only after kashering, often a day or two late. Call first.",level:"warn"};
  }
  if(m===2&&d===18)return{label:"Lag BaOmer",msg:"Lag BaOmer — normal hours; grill places are busy.",level:"info"};
  if(m===3){if(d===5)return{label:"Erev Shavuot",msg:"Erev Shavuot — restaurants close early afternoon.",level:"warn"};if(d===6)return closed(D?"Shavuot (day 1)":"Shavuot");if(D&&d===7)return closed("Shavuot (day 2)");}
  if(m===4&&((d===17&&w!==6)||(d===18&&w===0)))return fast("Shiva Asar B'Tammuz");
  if(m===5){
    if((d===9&&w!==6)||(d===10&&w===0))return fast("Tisha B'Av");
    if(d<=8)return{label:"The Nine Days",msg:"The Nine Days — many meat restaurants close or serve only fish/dairy until after Tisha B'Av. Dairy and fish places are your best bet.",level:"warn"};
    if(d===15)return{label:"Tu B'Av",msg:"Tu B'Av — normal hours.",level:"info"};
  }
  if(m===6&&d===29)return{label:"Erev Rosh Hashana",msg:"Erev Rosh Hashana — restaurants close early afternoon and stay closed through the chag.",level:"warn"};
  if(w===5)return{label:"Erev Shabbat",msg:"Friday — most places close by early afternoon (some pizza/bagel shops earlier). Motzei Shabbat openings are ~1 hour after Shabbat ends.",level:"warn"};
  if(w===6)return{label:"Shabbat",msg:"Shabbat — everything on this list is closed until Motzei Shabbat.",level:"closed"};
  return null;
}
function todayBanner(now){
  const f=gFixed(now.getFullYear(),now.getMonth()+1,now.getDate());
  const h=hFromFixed(f),t=holidayInfo(f),tm=holidayInfo(f+1);
  const hd=`${h.d} ${hMonthName(h)} ${h.y}`;
  let parts=[];
  if(t)parts.push(t.msg);
  if(tm&&(tm.level==="closed"||tm.label.startsWith("Erev")===false&&tm.level==="warn")&&(!t||tm.label!==t.label)&&now.getHours()>=12)parts.push(`Tonight begins ${tm.label.replace(/ \(.*\)/,"")}${tm.level==="closed"?" — places close this afternoon":""}.`);
  return{hebrew:hd,label:t?t.label:"",text:parts.join(" "),level:t?t.level:"info"};
}
// ---- Pesach view (driven by the calendar above): 8 Nisan through Isru Chag
const HTODAY=hFromFixed(gFixed(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate()));
let pesachView=false;
let pf={open:false,kit:false,geb:false};
function renderPesachChips(){
  const c=$("#pesachChips"); c.hidden=!pesachView;
  if(!pesachView){c.innerHTML="";return}
  c.innerHTML=`<span class="locmsg" style="align-self:center">Pesach:</span>`+
   [["open","Open on Pesach"],["kit","No kitniyot"],["geb","Non-gebrokts"]].map(([k,l])=>`<button class="chip" data-p="${k}" aria-pressed="${pf[k]}">${l}</button>`).join("");
}
$("#pesachChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const k=b.dataset.p;
  pf[k]=!pf[k];renderPesachChips();render();});

// ---- Plus code (Open Location Code) decoder, short codes recovered near the current city
const OLC_AB="23456789CFGHJMPQRVWX",OLC_RES=[20,1,.05,.0025,.000125];
function olcEncode(lat,lng){let a=lat+90,b=lng+180,c="";for(let i=0;i<5;i++){const r=OLC_RES[i];let d=Math.floor(a/r);a-=d*r;c+=OLC_AB[d];d=Math.floor(b/r);b-=d*r;c+=OLC_AB[d];if(i===3)c+="+"}return c}
function olcDecode(code){const s=code.replace("+","").toUpperCase();let lat=-90,lng=-180,res=20;for(let i=0;i+1<Math.min(s.length,10);i+=2){res=OLC_RES[i/2];lat+=OLC_AB.indexOf(s[i])*res;lng+=OLC_AB.indexOf(s[i+1])*res}return{lat:lat+res/2,lng:lng+res/2}}
function olcRecover(code,refLat,refLng){
  code=code.toUpperCase().replace(/[^23456789CFGHJMPQRVWX+]/g,"");const plus=code.indexOf("+");if(plus<0)return null;
  if(plus===8)return olcDecode(code);
  const pad=8-plus;if(pad!==2&&pad!==4&&pad!==6)return null;
  const res=Math.pow(20,2-pad/2),half=res/2;
  const full=olcEncode(refLat,refLng).slice(0,pad)+code;const c=olcDecode(full);
  if(refLat+half<c.lat&&c.lat-res>=-90)c.lat-=res;else if(refLat-half>c.lat&&c.lat+res<=90)c.lat+=res;
  if(refLng+half<c.lng&&c.lng-res>=-180)c.lng-=res;else if(refLng-half>c.lng&&c.lng+res<=180)c.lng+=res;
  return c;
}
function parseLocation(t){
  t=(t||"").trim();
  let m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||t.match(/geo:(-?\d+\.\d+),(-?\d+\.\d+)/)||t.match(/^\s*(-?\d+\.\d+)[,\s]+(-?\d+\.\d+)/);
  if(m)return{lat:+m[1],lng:+m[2],how:"coordinates"};
  const pc=t.match(/([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{2,3})/i);
  if(pc){const c=olcRecover(pc[1],C.center[0],C.center[1]);if(c)return{lat:c.lat,lng:c.lng,how:"plus code "+pc[1].toUpperCase()}}
  return null;
}

// ---- location & walking time
let me=null, sortNear=false, maxWalk=0;
const km=(a,b,c,d)=>{const R=6371,toR=x=>x*Math.PI/180,dl=toR(c-a),dg=toR(d-b);const h=Math.sin(dl/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function walkMin(r){if(!me||r.lat==null)return null;const d=km(me.lat,me.lng,r.lat,r.lng)*1.3;return Math.max(1,Math.round(d/4.3*60))}
function fmtWalk(m){return m==null?"":(m>=60?`~${Math.floor(m/60)} h ${m%60} min walk`:`~${m} min walk`)}
function setMe(lat,lng,label){
  me={lat,lng};sortNear=true;
  $("#locMsg").textContent=`From ${label}. Estimates use straight-line ×1.3 at 4.3 km/h; tap Walking directions for real routing.`+(inBox(C,lat,lng)?"":` (That is outside ${C.name}.)`);
  $("#clearLoc").hidden=false;$("#walkChips").hidden=false;
  try{localStorage.setItem(C.store+"_loc",JSON.stringify({lat,lng,label}))}catch(e){}
  renderWalkChips();render();
}
function clearMe(){me=null;sortNear=false;maxWalk=0;$("#landmark").value="";$("#locMsg").textContent="";$("#clearLoc").hidden=true;$("#walkChips").hidden=true}
$("#locBtn").addEventListener("click",()=>{
  if(!navigator.geolocation||window.self!==window.top){$("#locMsg").textContent="Inside this viewer the browser is not allowed to ask for location. Pick a landmark, or paste a Plus Code / Maps link (tap the button for how).";return}
  $("#locMsg").textContent="Locating…";
  navigator.geolocation.getCurrentPosition(p=>{
     const lat=p.coords.latitude,lng=p.coords.longitude,id=cityAt(lat,lng);
     if(id&&id!==CID)setCity(id,true);   // you are in another supported city: switch to it
     setMe(lat,lng,"your location");},
   e=>{$("#locMsg").textContent=(e.code===1?"Location is blocked inside this viewer (no prompt is shown). ":"Couldn't get location. ")+"Pick a landmark, paste coordinates, or open this page in your phone's browser."},
   {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
});
$("#landmark").addEventListener("change",e=>{const l=LAND[+e.target.value];if(l)setMe(l[1],l[2],l[0]);});
$("#coordBtn").addEventListener("click",()=>{
  const t=prompt(`In Google Maps: tap the blue dot (or long-press a spot) → you'll see a Plus Code like ${C.plusEx}, or coordinates like ${C.coordEx}. Copy and paste it here. (Short maps.app.goo.gl links don't contain the location.)`);
  if(!t)return;const r=parseLocation(t);
  if(!r){$("#locMsg").textContent=`Couldn't read that. Paste a Plus Code (e.g. ${C.plusEx.split(" ")[0]}), coordinates (${C.coordEx}) or a full google.com/maps link with @lat,lng.`;return}
  const id=cityAt(r.lat,r.lng);if(id&&id!==CID)setCity(id,true);
  setMe(r.lat,r.lng,r.how);
});
$("#clearLoc").addEventListener("click",()=>{clearMe();try{localStorage.removeItem(C.store+"_loc")}catch(e){}render()});
function renderWalkChips(){
  const opts=[[0,"Any distance"],[10,"≤10 min"],[20,"≤20 min"],[30,"≤30 min"],[45,"≤45 min"]];
  $("#walkChips").innerHTML=opts.map(([v,l])=>`<button class="chip" data-w="${v}" aria-pressed="${maxWalk===v}">${l}</button>`).join("")+`<button class="chip" id="sortBtn" aria-pressed="${sortNear}">Nearest first</button>`;
}
$("#walkChips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  if(b.id==="sortBtn"){sortNear=!sortNear}else{maxWalk=+b.dataset.w}
  renderWalkChips();render();
});
const M = q => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q+", "+C.maps);
const walkURL=r=>`https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${encodeURIComponent(r.addr+", "+C.maps)}`;

const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hLabel=r=>r.hl||H[r.h].label;

function chip(id,label,color,on){return `<button class="chip" data-id="${id}" aria-pressed="${on}">${color?`<span class="dot" style="--c:${color}"></span>`:""}${label}</button>`}
function renderChips(){
  $("#hechChips").innerHTML = Object.entries(H).filter(([id])=>R.some(r=>r.h===id)).map(([id,v])=>chip(id,v.label,v.c,state.h.has(id))).join("");
  $("#kindChips").innerHTML = Object.entries(K).map(([id,l])=>chip(id,l,`var(--${id})`,state.k.has(id))).join("");
}
$("#hechChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const id=b.dataset.id;state.h.has(id)?state.h.delete(id):state.h.add(id);save();renderChips();render()});
$("#kindChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const id=b.dataset.id;state.k.has(id)?state.k.delete(id):state.k.add(id);save();renderChips();render()});

$("#q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();$("#searchWrap").classList.toggle("has",!!state.q);render()});
$("#clearQ").addEventListener("click",()=>{$("#q").value="";state.q="";$("#searchWrap").classList.remove("has");render();$("#q").focus()});

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  state.tab=t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
  ["verified","unconfirmed","excluded","items"].forEach(id=>$("#"+id).hidden=id!==state.tab);
}));

const P=r=>r.pesach||{};
function matches(r){
  if(pesachView){const p=P(r);
    if(pf.open&&p.open!==true)return false;
    if(pf.kit&&p.kitniyot!==false)return false;
    if(pf.geb&&p.gebrokts!==false)return false;}
  if(state.h.size&&!state.h.has(r.h))return false;
  if(state.k.size&&!state.k.has(r.k))return false;
  if(!state.q)return true;
  const hay=[r.n,r.heb,r.t,r.area,r.addr,r.nut,r.order,H[r.h].label,r.hl,K[r.k]].join(" ").toLowerCase();
  return state.q.split(/\s+/).every(w=>hay.includes(w));
}
function pesachLine(r){const p=P(r);const y=v=>v===true?"yes":v===false?"no":"not verified";
  if(p.open==null&&p.kitniyot==null&&p.gebrokts==null)return `<span class="warnmark">Not verified for Pesach ${HTODAY.y} — call before you go.</span>`+(p.note?" "+esc(p.note):"");
  return `Open: ${y(p.open)} · Kitniyot served: ${y(p.kitniyot)} · Gebrokts served: ${y(p.gebrokts)}`+(p.note?" · "+esc(p.note):"");}
function rowHTML(r,i){
  const hc=H[r.h].c;
  return `<div class="row" id="r${i}">
    <button class="head" aria-expanded="false" data-i="${i}">
      <span class="kind" style="--k:var(--${r.k})" title="${K[r.k]}"></span>
      <span class="name">${esc(r.n)}${r.heb?`<span class="heb">${esc(r.heb)}</span>`:""}${r.warn?`<span class="warnmark" title="Conflicting reports">⚠</span>`:""}</span>
      <span class="price">${RU.cur.repeat(r.price||0)}</span>
      <span class="sub">${esc(r.t)} · ${esc(r.area)}${walkMin(r)!=null?` · <span class="walk">${fmtWalk(walkMin(r))}</span>`:(me&&r.lat==null?" · location unknown":"")}</span>
    </button>
    <div class="detail">
      <dl>
        <dt>Hechsher</dt><dd><span class="stamp" style="--hc:${hc}">${esc(hLabel(r))}</span> <a href="${r.proof}" target="_blank" rel="noopener">${esc(r.plabel)}</a></dd>
        <dt>Kashrus type</dt><dd>${K[r.k]}</dd>
        <dt>Nutrition</dt><dd>${esc(r.nut)}${r.order?` — <em>${esc(r.order)}</em>`:""}</dd>
        <dt>Reviews</dt><dd>${esc(r.rev)}</dd>
        <dt>Hours</dt><dd>${esc(r.hours)}</dd>
        <dt>Address</dt><dd>${esc(r.addr)}${r.area&&r.area!=="—"?", "+esc(r.area):""}</dd>
        ${pesachView?`<dt>Pesach</dt><dd>${pesachLine(r)}</dd>`:""}
      </dl>
      ${r.warn?`<div class="warnbox">${esc(r.warn)}</div>`:""}
      <div class="actions">
        <a class="btn primary" href="${walkURL(r)}" target="_blank" rel="noopener">Walking directions</a>
        <a class="btn" href="${M(r.addr)}" target="_blank" rel="noopener">Open in Maps</a>
        ${r.phone?`<a class="btn" href="tel:${r.phone.replace(/[^\d+]/g,"")}">Call ${esc(r.phone)}</a>`:""}
        <a class="btn" href="${r.proof}" target="_blank" rel="noopener">Hechsher source</a>
      </div>
    </div>
  </div>`;
}
function render(){
  let list=R.map((r,i)=>({r,i})).filter(x=>matches(x.r));
  if(me&&maxWalk){list=list.filter(x=>{const w=walkMin(x.r);return w!=null&&w<=maxWalk});}
  if(me&&sortNear){list.sort((a,b)=>(walkMin(a.r)??9e9)-(walkMin(b.r)??9e9));}
  $("#status").textContent = (list.length===R.length ? `${R.length} verified places` : `${list.length} of ${R.length} places`)+(me&&maxWalk?` within ~${maxWalk} min walk`:"");
  if(!R.length){$("#results").innerHTML=`<div class="empty">No verified places for ${esc(C.name)} yet.</div>`;return}
  if(!list.length){$("#results").innerHTML=`<div class="empty">Nothing matches. ${pesachView&&(pf.open||pf.kit||pf.geb)?"Pesach status hasn't been verified for these places yet — the chips only show confirmed ones. ":""}${me&&maxWalk?"Try a longer walk time or ":"Try "}fewer filters or a different word — search covers name, food type, street and neighborhood.</div>`;return}
  let html="";
  if(me&&sortNear){$("#results").innerHTML=`<div class="group" style="--gc:var(--green)"><h2>Nearest first<span>${list.length}</span></h2>${list.map(x=>rowHTML(x.r,x.i)).join("")}</div>`;return}
  for(const [id,v] of Object.entries(H)){
    const g=list.filter(x=>x.r.h===id);
    if(!g.length)continue;
    html+=`<div class="group" style="--gc:${v.c}"><h2>${v.g||"Badatz "+v.label}<span>${g.length}</span></h2>${g.map(x=>rowHTML(x.r,x.i)).join("")}</div>`;
  }
  $("#results").innerHTML=html;
}
$("#results").addEventListener("click",e=>{
  const b=e.target.closest(".head");if(!b)return;
  const row=b.parentElement;const open=!row.classList.contains("open");
  row.classList.toggle("open",open);b.setAttribute("aria-expanded",open);
});

// ---- switch city: everything city-specific is (re)drawn here
function setCity(id,keepLoc){
  CID=id;C=CITIES[id];RU=RULES[C.rules];H=RU.H;
  ({R,UNCONF,EXCL}=DATA[id]);ITEMS=DATA[id].ITEMS||[];LAND=C.LAND;
  try{localStorage.setItem("kf_city",id)}catch(e){}
  if(new URLSearchParams(location.search).get("city")!==id)try{history.replaceState(null,"","?city="+id)}catch(e){}
  $("#city").value=id;
  document.title=`${C.title} – kosher restaurants by hechsher`;
  $("#citySub").textContent=C.sub;
  $("#q").placeholder="Search name, food, street, neighborhood…";
  $("#landmark").innerHTML=`<option value="">…or I'm near</option>`+LAND.map((l,i)=>`<option value="${i}">${l[0]}</option>`).join("");
  document.querySelector('.tab[data-tab="unconfirmed"]').textContent=RU.unconfTab;
  $("#unconfNote").textContent=C.unconfNote;$("#exclNote").textContent=C.exclNote;$("#legendCert").textContent=RU.cert;
  $("#unconfList").innerHTML=UNCONF.map(([n,r])=>`<div class="row"><span class="n">${esc(n)}</span><span class="r">${esc(r)}</span></div>`).join("")||`<div class="empty">None.</div>`;
  $("#exclList").innerHTML=EXCL.map(([n,r])=>`<div class="row"><span class="n">${esc(n)}</span><span class="r">${esc(r)}</span></div>`).join("")||`<div class="empty">None.</div>`;
  $("#itemsNote").textContent=C.itemsNote||"";
  $("#itemsList").innerHTML=ITEMS.map(([n,r])=>`<div class="row"><span class="n">${esc(n)}</span><span class="r">${esc(r)}</span></div>`).join("")||`<div class="empty">None recorded yet.</div>`;
  pesachView = HTODAY.m===1 && HTODAY.d>=8 && HTODAY.d<=(RU.diaspora?23:22);
  loadState();
  const b=todayBanner(new Date());const el=$("#banner");el.className="notice "+b.level;el.innerHTML=`<b>${esc(b.hebrew)}${b.label?" · "+esc(b.label):""}</b>${esc(b.text||"Normal hours today.")} Always check the ${RU.cert} and its expiry date on the wall.`;
  if(!keepLoc){
    clearMe();
    try{const l=JSON.parse(localStorage.getItem(C.store+"_loc")||"null");if(l&&l.lat){const idx=LAND.findIndex(x=>x[0]===l.label);setMe(l.lat,l.lng,l.label);if(idx>=0)$("#landmark").value=idx;}}catch(e){}
  }
  renderPesachChips();renderChips();render();
}
$("#city").addEventListener("change",e=>setCity(e.target.value));
setCity(pickCity());
